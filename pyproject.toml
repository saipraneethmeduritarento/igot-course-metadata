[project]
name = "igot-metadata"
version = "0.1.0"
description = "iGOT course and resource metadata generation"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "google-genai",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
